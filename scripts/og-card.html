<!doctype html>
<!-- Source for og/home.png (1200x630). Rendered by scripts/og.mjs with the same HIG roles, Bloxwap
     fonts and supplied lockup as the site; edit this file and run npm run og, never the PNG. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>OG card source</title>
  <link rel="stylesheet" href="/assets/font/bloxwap-font.css" />
  <link rel="stylesheet" href="/assets/hig/tokens.css" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; background: var(--hig-background); color: var(--hig-text); }
    .card { box-sizing: border-box; display: flex; flex-direction: column; width: 1200px; height: 630px; padding: calc(var(--hig-space-section) * 1.5) calc(var(--hig-space-section) * 1.75); border-left: var(--hig-space-xxl) solid var(--hig-action); }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .top img { height: 48px; width: auto; }
    .eyebrow { color: var(--hig-muted); font: var(--hig-type-label-weight) var(--hig-type-title-size)/var(--hig-type-title-line-height) var(--hig-font-mono); text-transform: uppercase; }
    h1 { margin: auto 0 var(--hig-space-xxl); font: var(--hig-type-display-weight) calc(var(--hig-type-display-size) * 2)/calc(var(--hig-type-display-line-height) * 1.9) var(--hig-font-sans); }
    p { margin: 0; max-width: 30em; color: var(--hig-muted); font: var(--hig-type-body-weight) var(--hig-type-title-size)/var(--hig-type-title-line-height) var(--hig-font-sans); }
  </style>
</head>
<body>
  <div class="card">
    <div class="top"><img src="/lockup.svg" alt="Bloxwap" /><span class="eyebrow">Open source</span></div>
    <h1>Bloxwap on GitHub</h1>
    <p>Chart SDK, Hyperliquid SDK, SFX, Haptic and Bloxwap Font: developer tools and typefaces from Bloxwap, Inc.</p>
  </div>
</body>
</html>
